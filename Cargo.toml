[package]
name = "dfutil"
version = "0.0.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
globset = "0.4.21"
hex = "0.4.3"
liblzma = { version = "0.4.9", features = ["static"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.2.0"
toml_edit = "0.25.18"
ureq = "3.5.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
