name: Release

# Pushing a vX.Y.Z tag builds static (musl) Linux binaries for x86_64 and
# aarch64 and publishes them, with SHA-256 checksums, as a GitHub Release.
# The tag must match the version in Cargo.toml, so bump that first.
#
# Assets are named dfutil-<tag>-<target>.tar.gz, each holding a single
# `dfutil` binary at the archive root.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches Cargo.toml
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$crate_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $crate_version"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          # Native Arm runner, so the binary can be smoke-tested below. GitHub
          # has no ubuntu-26.04-arm image yet.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # ring (rustls's crypto backend) compiles C, which needs musl-gcc.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/dfutil --version

      - name: Package
        run: |
          name="dfutil-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/$name.tar.gz" dfutil
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
